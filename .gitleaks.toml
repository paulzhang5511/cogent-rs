# gitleaks 配置：阻止内部凭据/域名误提交。
# 发布前根据实际内部域名/关键词维护本文件与 .github/domain-blacklist.txt。
title = "Cogent gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "internal-domain"
description = "Internal domain names that must never be committed"
regex = '''(internal-domain-1|internal-domain-2)'''
entropy = 0
secretGroup = 0

[[rules]]
id = "internal-identity"
description = "Internal user / machine identifiers"
regex = '''(internal-user-id|internal-machine-id)'''
entropy = 0
secretGroup = 0

# 全局豁免：gitleaks 自身配置文件与黑名单清单里"定义规则/列举占位域名"的内容
# 不是真正泄露（规则正则与黑名单条目会命中自身），需从扫描中排除。
[allowlist]
description = "Ignore gitleaks config files (they define the rules and list placeholders)"
paths = [
  '''\.gitleaks\.toml''',
  '''\.github/domain-blacklist\.txt''',
]
