name: ci
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (zero warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace
      - name: Test (offline, no token)
        run: cargo test --workspace

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Internal domain blacklist
        run: |
          # 排除规则定义文件自身（.gitleaks.toml 的 regex、domain-blacklist.txt 的清单），
          # 它们只是"定义规则/列占位域名"，不是源码中真实出现的内部域名。
          if git grep -nEf .github/domain-blacklist.txt -- ':!Cargo.lock' ':!.gitleaks.toml' ':!.github/domain-blacklist.txt'; then
            echo "::error::internal domain detected in source"; exit 1
          fi
